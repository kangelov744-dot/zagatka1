</div></div><script>

["Iva","MG","Kiril is not telling the truth about where he was.","She quarrelled with him and doesn't want to look like she's hurting him.",""],

["Kiril","Gradinka","Headed back toward MG after the quarrel with Iva.","Lies about the time he came back.",""],
["Kremena","MG","Knows Kristiyan had a meeting after the last class and was very worried. Says Elitsa never parts with her navy-blue backpack.","Doesn't know who the meeting was with.",""],
["Kristina","Jorka","Spoke with Kristiyan that day.","Deleted a message with personal information unrelated to the case.",""],
["Kristiyan Nikolaev","MG","Kristiyan Angelov tried to reach him by phone.","They had arranged a talk, but he says it was cancelled. Phone records can check this.",""],
["Natalia","Lindo","Has a conflict with Silvia.","Learned that day that Silvia talks about her behind her back.","Not confirmed for the whole period."],
["Nikol","MG","Saw Kristiyan leave something in a classroom.","Didn't check what, so as not to get involved.",""],
["Siyana","Jorka","Heard the name Teodor in a conversation between two students.","Doesn't know whether they meant him or someone else.",""],
["Silvia (Sisa)","Gradinka","Her conflict with Natalia is more serious than she admits.","They exchanged harsh messages. Knows about a talk between Kristiyan and Natalia but wasn't present.",""],
["Sofia","MG","Received a message from an anonymous profile: “Kristiyan will soon find out who your real friend is. You definately don't see it.”","The profile was created very recently.",""],
["Spas Damyanov","Korner","Is into knives and collecting.","Kristiyan joked about his hobby and they quarrelled. No link to the case.",""],
["Spas Terziyski","MG","Saw a person coming out of Gradinka.","Did not recognise the face, but remembers the colour of the clothes.",""],
["Teodor","Lindo","Used to get anonymous insulting messages and deleted them.","Quarrelled with Kristiyan a week earlier and is ashamed to admit it. Around 15:10 he stepped out for a few minutes to the toilet.","Claims he was in Lindo non-stop from 15:00 to 15:30."],
["Hristiyana","MG","Kristiyan told her he was afraid someone would expose a secret of his.","Knows about an arranged meeting, but not with whom.",""],

const E=[[0,"The last message","15:06, from Kristiyan's phone: “We need to talk. I know what you did. If you don't come, everyone will find out.” Recipient unknown."],
[0,"Torn sheet","In Kristiyan's pocket: the numbers 12 – 9 – 14 – 4 – 15 and below them the word LAST."],

[3,"Messages from voluntarily handed-over phones","Viktor: “I saw something, but I'm not sure what.” Spas Damyanov: “I have nothing to do with it, I never met him.” Elitsa: “Don't text me, I definately have nothing to do with this.” (Others did not provide any.)"],
[4,"Call list","One number called Kristiyan three times: 14:20, 14:35, 14:55. Number: 0888 456 123."],
[5,"Korner log","Spas Damyanov bought something for his collection at 15:05 and left. He returned at 15:25."],
[6,"The anonymous profiles","The profiles that sent messages to classmates were used from a phone connected to Korner's Wi-Fi."],

{t:"The secret code",q:"The numbers on the sheet are a cipher. Which word do they hide?",a:"LINDO",h:"The numbers follow the order of the alphabet.",r:"Lindo. Kristiyan wrote down the place of his last meeting."},
{t:"The wrong clock",q:"At what time was the figure really recorded by the Lindo camera? (hh:mm)",a:"15:17",h:"The clock is slow, so the real time is later.",r:"The real time is 15:17, one minute before the receipt. Lindo and Korner are next to each other. Teodor left earlier (15:07–15:13), so it isn't him."},
{t:"The backpack",q:"Witnesses saw a person with a dark backpack. Which of those who say they were in Korner carries one? (name)",a:"Elitsa",h:"First check who says they were in Korner.",r:"Elitsa has a navy-blue backpack. New evidence is unlocked."},
{t:"The note from Korner",q:"Who wrote the note on the back of the receipt? Look for a repeated spelling habit. (name)",a:"Elitsa",h:"Compare words in Evidence and in the Case.",r:"The note was written by Elitsa, who was in Korner at 15:18."},
{t:"The number",q:"Whose number called Kristiyan? (name)",a:"Elitsa",h:"Interview people connected to Kristiyan.",r:"The number is Elitsa's. She called Kristiyan three times, and at 15:06 he texted her, inviting her to meet at Lindo."},

{t:"The hidden sign",q:"Which letter did Kristiyan write on the back of the sheet? (letter)",a:"E",h:"Whose initial are we looking for?",r:"The letter E. Open the Accusation tab."}];

const HM=3;
function ok(g,v){const n=x=>x.trim().toUpperCase().replace(/\s+/g,"").replace(/TZ/g,"TS");return n(v)===n(g)}
const tn=$("nav");tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>go(i);tn.append(b)});

$("s0").innerHTML=`<h1>The Last Break</h1><p class="note">Strictly confidential. Investigation team only.</p>
<h2>Case description</h2><p>On 5 November 2026, at 15:42, a report was filed about an incident near the Math High School. <b>Kristiyan Angelov</b> was found without signs of life. His phone holds the last message he sent:</p><div class="paper"><span class="tag">EVIDENCE</span><i>“We need to talk. I know what you did. If you don't come, everyone will find out.”</i></div><p>The recipient is unknown. Some claim they never spoke to Kristiyan at all, but at least three of them are lying.</p>
<h2>How to play</h2><p>The investigation has eight steps. Each unlocks after the previous one. Nobody will hand you the answers: cross-check the Case, the Evidence and the Interviews. Careful: there are only ${HM} hints, and every wrong answer or wrong accusation lowers your score.</p><p class="note">Rule: lying about an alibi doesn't make someone a killer. Many people hide small secrets, and some clues point in the wrong direction.</p>
<h2>Places</h2><p>MG · Gradinka · Lindo (café) · Korner (shop) · Jorka (snack stand) · Fasa. Lindo and Korner are next to each other.</p>
<h2>Timeline</h2><table>${[["12:30","Kristiyan enters MG"],["13:15","Tense conversation"],["14:05","Spotted in Gradinka"],["14:40","Receives an unknown message"],["15:06","Sends his last message"],["15:30","Last confirmed sighting"],["15:42","Report filed"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>
<h2>Witness statements</h2>${S.map((s,i)=>`<div class="paper"><span class="tag">STATEMENT #00${i+1}</span><b>${s[0]}:</b> “${s[1]}”</div>`).join("")}
<h2>Where they say they were</h2><table>${C.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td></tr>`).join("")}</table>`;
$("s2").innerHTML=`<h1>Interviews</h1><p>Pick a suspect and question them. Pressure only works after step 4.</p><select id="who"><option value="">Pick a name</option>${C.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("")}</select> <button class="btn" id="show">Question</button><div id="card"></div>`;
$("show").onclick=drawQ;
function drawQ(){const v=$("who").value;if(v==="")return;const c=C[v];$("card").innerHTML=`<div class="paper"><span class="tag">INTERVIEW RECORD</span><div class="id"><div class="photo"></div><div><h3>${c[0]}</h3>Says they were at: <b>${c[1]}</b></div></div><p><b>Says:</b> ${c[2]}${PH[c[0]]?` Phone: ${PH[c[0]]}.`:""}</p>${c[4]?`<p><b>Alibi:</b> ${c[4]}</p>`:""}${sv>=4?`<p><b>Under pressure:</b> ${c[3]||"Nothing important."}</p>`:`<p>The interview isn't finished. Come back later.</p>`}</div>`}
function drawE(){$("s1").innerHTML=`<h1>Evidence</h1><p class="note">New evidence unlocks with every solved step. Not all of it matters.</p>`+E.map((e,i)=>sv>=e[0]?`<div class="paper"><span class="tag">EVIDENCE #${i+1}</span><b>${e[1]}</b><br>${e[2]}</div>`:`<div class="paper red">██████ CLASSIFIED ██████</div>`).join("")}
function drawS(){$("s3").innerHTML=`<h1>Investigation</h1><div class="bar"><i style="width:${sv/8*100}%"></i></div><div class="cnt"><span>Solved: ${sv} of 8</span><span>Hints: ${hc}/${HM}</span><span>Mistakes: ${ms}</span></div>`+ST.slice(0,sv+1).map((s,i)=>{const d=i<sv;if(sv==8&&!d)return"";return d?`<div class="paper"><span class="tag">STEP ${i+1}</span><b>${s.t}</b><p class="ok">Solved. ${s.r}</p></div>`:`<div class="paper"><span class="tag">STEP ${i+1}</span><b>${s.t}</b><p><b>${s.q}</b></p>${s.o?s.o.map(o=>`<button class="btn g" onclick="an(${i},this.textContent)">${o}</button>`).join(""):`<input id="a${i}" size="14" placeholder="Answer"> <button class="btn" onclick="an(${i},$('a${i}').value)">Check</button>`}<p id="r${i}" class="no"></p><button class="btn g" onclick="hn(${i})">Hint</button><p id="h${i}" class="note"></p></div>`}).join("")}
function hn(i){const e=$("h"+i);if(e.textContent){e.textContent="";return}if(hc>=HM){e.textContent="No hints left.";return}hc++;e.textContent=ST[i].h;document.querySelector(".cnt span:nth-child(2)").textContent=`Hints: ${hc}/${HM}`}
function an(i,v){if(i!=sv)return;if(ok(ST[i].a,v)){sv++;drawS();drawE();drawA();if($("who").value!=="")drawQ()}else{ms++;drawS();$("r"+i).textContent="Not correct. Look for more information."}}

done=true;const sc=Math.max(0,100-ms*8-hc*6);const rk=sc>=85?"Chief Investigator":sc>=60?"Investigator":"Trainee";
